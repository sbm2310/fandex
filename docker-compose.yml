# Local development services. Start with `docker compose up -d`, stop with `docker compose down`.
# The credentials below are for local development only.
services:
  postgres:
    image: postgres:18-alpine
    container_name: fandex-postgres
    environment:
      POSTGRES_USER: fandex
      POSTGRES_PASSWORD: fandex
      POSTGRES_DB: fandex
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fandex -d fandex']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
