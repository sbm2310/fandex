appId: host.exp.Exponent
name: A guest's book shows its series and the books missing from it (live Wikidata and Open Library)
tags:
  - guest
---
- runFlow:
    file: common/open.yaml
    env:
      ROUTE: add
- tapOn: 'Search books'
- inputText: 'the way of kings sanderson'
- extendedWaitUntil:
    visible: 'Add The Way of Kings'
    timeout: 60000
- tapOn: 'Add The Way of Kings'
- assertVisible: 'The Way of Kings is in your collection'

- hideKeyboard
- tapOn:
    text: 'Collection'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'Ask your collection, .*'
    timeout: 15000
- tapOn: 'The Way of Kings, .*'
# Wikidata knows the Stormlight Archive; how many books it lists may grow.
- scrollUntilVisible:
    element: "Book 1 of \\d+ in The Stormlight Archive"
    timeout: 30000
# The missing books load after the heading (live Open Library), and the item page is tall
# enough that they start below the fold: scroll until the first one is on screen.
- scrollUntilVisible:
    element: 'Add Words of Radiance'
    timeout: 60000
- takeScreenshot: output/book-series
